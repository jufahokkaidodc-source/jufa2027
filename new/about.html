<html lang="ja">

<style>
:root{--navy:#071b2e;--navy2:#0e2c48;--lime:#c5f26d;--ink:#141e28;--muted:#6b7a89;--line:#e3e8ee;--bg:#f4f6f8;--blue:#145ec9;--red:#c0392b;--num:"Barlow Condensed","Noto Sans JP",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{width:min(1100px,100% - 40px);margin:auto}
.demo{background:#fff4d6;color:#7a5a00;font-size:12px;text-align:center;padding:7px 16px}
.header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.head{height:62px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{height:46px;border-radius:8px;background:#fff;display:flex;align-items:center;flex:none;padding:4px 7px}
.logo img{height:100%;width:auto;display:block}
.brandname{font-size:15px;font-weight:900;line-height:1.25}
.brandname small{display:block;font-family:var(--num);font-size:11px;color:#9fb8cc;letter-spacing:.04em;font-weight:600}
.nav{display:flex;margin-left:auto;height:100%}
.nav a{display:flex;align-items:center;padding:0 13px;font-size:13px;font-weight:700;color:#d2e0eb;border-bottom:3px solid transparent;transition:.15s}
.nav a:hover,.nav a.on{color:#fff;border-bottom-color:var(--lime)}
.menubtn{display:none;margin-left:auto;background:transparent;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:7px 11px;font-size:12px}
.pagehead{background:var(--navy);color:#fff;border-top:1px solid #ffffff12}
.pagehead .wrap{padding:30px 0 28px}
.crumb{font-size:11px;color:#9fb8cc;margin-bottom:14px}
.crumb a:hover{color:#fff;text-decoration:underline}
.eyebrow{font-family:var(--num);font-size:13px;letter-spacing:.18em;color:var(--lime);font-weight:700}
.pagehead h1{font-size:clamp(26px,4vw,40px);margin:4px 0 0;font-weight:900;letter-spacing:-.02em}
.main{padding:32px 0 64px}
.section{margin-top:44px}
.section:first-child{margin-top:0}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.sechead h2{margin:0;font-size:22px;font-weight:900;line-height:1.3}
.sechead h2 small{display:block;font-family:var(--num);font-size:12px;letter-spacing:.16em;color:var(--blue);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.empty{padding:22px;color:var(--muted);font-size:13px;margin:0;line-height:1.8}
.note{font-size:11px;color:var(--muted);margin:9px 2px 0;line-height:1.7}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chips button,.chips a{flex:none;border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:30px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.chips [aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cat{display:inline-block;font-size:10.5px;font-weight:700;color:var(--blue);border:1px solid #c9daf2;padding:1px 7px;border-radius:3px;white-space:nowrap}
.imp{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--red);padding:2px 7px;border-radius:3px}
.footer{background:var(--navy);color:#a5bccf;padding:36px 0 30px;font-size:12px}
.footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer strong{color:#fff;font-size:14px}
.footer p{margin:8px 0 0;line-height:1.8}
.footer nav{display:flex;gap:18px;flex-wrap:wrap}
.footer nav a:hover{color:var(--lime)}
.sk{display:block;height:14px;margin:14px 18px;border-radius:6px;background:linear-gradient(90deg,#e9eef3 25%,#f5f8fa 50%,#e9eef3 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}

.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.jump a{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:30px;font-size:12.5px;font-weight:700;color:var(--muted)}
.jump a:hover{border-color:var(--ink);color:var(--ink)}
.ov{display:grid;gap:14px}
.ov article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px}
.ov h3{margin:0 0 10px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:10px}
.ov h3:before{content:"";width:4px;height:18px;background:var(--lime);border-radius:2px}
.ov p{margin:0;font-size:14.5px;line-height:2}
.ov p a,.ct p a{color:var(--blue);text-decoration:underline;word-break:break-all}
.ov .lk{display:inline-block;margin-top:10px;font-size:13px;color:var(--blue);font-weight:700}
.league+.league{margin-top:24px}
.league h3{font-size:14px;font-weight:900;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.league h3 span{font-size:11px;color:var(--muted);font-weight:500}
.clubs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px} /* 1行に4つ（スマホは2つ） */
.club{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;transition:.15s;min-width:0}
.club:hover{border-color:var(--blue);transform:translateY(-2px)}
.club .cv{--c:#145ec9;position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--c),var(--navy));overflow:hidden}
.club .cv img{width:100%;height:100%;object-fit:cover;display:block}
.club .cv:not(.photo):after{content:"";position:absolute;right:-24px;top:-30px;width:110px;height:110px;border-radius:50%;border:16px solid #ffffff1f}
.club>.crest{margin-top:-22px;position:relative;border:3px solid #fff;box-sizing:content-box}
.club>.crest.img{background:#fff!important;border-radius:50%}
.club div{min-width:0;width:100%;padding:6px 10px 12px}
.club strong{display:block;font-size:14px;overflow-wrap:anywhere}
.club small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{--c:#145ec9;width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;box-shadow:inset 0 0 0 2.5px #ffffff38}
.crest.two{font-size:12px;letter-spacing:-.05em}
.crest.img{background:transparent!important;box-shadow:none!important;border-radius:0}
.crest.img img{width:100%;height:100%;object-fit:contain;display:block}
.crest{position:relative}
.crest .bdg{position:absolute;right:-6px;bottom:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--lime);color:var(--navy);font:800 10px/16px var(--num);font-style:normal;letter-spacing:0;text-align:center;white-space:nowrap;box-shadow:0 0 0 1.5px #fff}
.crest.xs .bdg{display:none}
.crest.sm .bdg{min-width:14px;height:14px;padding:0 3px;font-size:9px;line-height:14px}
.crest.xl .bdg{min-width:28px;height:24px;padding:0 7px;border-radius:12px;font-size:15px;line-height:24px;right:-8px;bottom:-2px}

.docs a,.docs div{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:15px 20px;border-top:1px solid var(--line)}
.docs>:first-child{border-top:0}
.docs a:hover{background:#f6f9fc}
.docs .ic{width:40px;height:40px;border-radius:9px;background:#eef3f7;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:12px;color:var(--muted)}
.docs .ic.pdf{background:#fdecea;color:var(--red)}
.docs b{font-size:14.5px}
.docs small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.docs .go{color:var(--muted);font-size:13px}
.ct{background:var(--navy);color:#fff;border-radius:16px;padding:26px 28px;display:grid;gap:18px}
.ct h3{margin:0 0 6px;font-size:17px}
.ct p{margin:0;font-size:14px;line-height:1.9;color:#c9d9e6}
.ct p a{color:var(--lime)}
.ct .btn{display:inline-block;margin-top:12px;background:var(--lime);color:var(--navy);font-weight:700;font-size:14px;padding:11px 22px;border-radius:30px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){.nav a{padding:0 8px;font-size:12px}}
@media(max-width:680px){
  .wrap{width:calc(100% - 32px)}
  .head{height:56px}
  .logo{height:36px;padding:3px 5px}
  .brand{gap:8px}
  .brandname{font-size:13px}
  .menubtn{font-size:0;padding:6px 11px;flex:none}
  .menubtn:before{content:"☰";font-size:18px;line-height:1}
  .brandname small{font-size:9.5px;letter-spacing:0;white-space:normal;line-height:1.25}
  .brandname{font-size:13px}
  .menubtn{display:block}
  .nav{display:none;position:absolute;top:56px;left:0;right:0;flex-direction:column;background:var(--navy);padding:6px 16px 14px;height:auto;border-bottom:1px solid #ffffff1a}
  .nav.open{display:flex}
  .nav a{padding:13px 8px;border-bottom:1px solid #ffffff12}
  .pagehead .wrap{padding:22px 0 22px}
  .main{padding-top:22px}
  .sechead h2{font-size:19px}
  .ov article{padding:18px}
  .clubs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .docs a,.docs div{padding:13px 14px;grid-template-columns:36px 1fr}
  .docs .go{display:none}
  .ct{padding:20px}
  .ct .btn{display:block;text-align:center}
}

/* カードのエンブレムの丸を大きく（2026-10） */
.club>.crest{width:76px;height:76px;margin-top:-40px;font-size:26px}
.club>.crest.two{font-size:21px}
.club>.crest .bdg{min-width:22px;height:20px;line-height:20px;font-size:12px;border-radius:10px}
@media(max-width:680px){.club>.crest{width:60px;height:60px;margin-top:-32px;font-size:21px}.club>.crest.two{font-size:16px}}

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=v=>v!=null&&String(v).trim()!=='';
const PARAMS=new URLSearchParams(location.search);
let DEMO=PARAMS.has('demo');
const WD=['日','月','火','水','木','金','土'];
function fmtDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return s||'';return m[1]+'.'+m[2]+'.'+m[3]+'（'+WD[new Date(+m[1],+m[2]-1,+m[3]).getDay()]+'）'}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
/* 本文：改行を保ち、URLをリンクにする */
function richText(t){return esc(t).replace(/(https?:\/\/[^\s<>"']+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>')}
const shortComp=n=>String(n||'').replace(/^\d{4}年度\s*/,'').replace(/第\d+回\s*/,'').replace(/^北海道学生サッカー/,'').replace(/^北海道/,'').trim()||n;
async function getJSON(file){
  if(DEMO)return demoData(file);
  const r=await fetch('../results/data/'+file,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  return r.json();
}
async function boot(file,fn){
  let d;
  try{d=await getJSON(file)}
  catch(e){
    if(!/github\.io$/.test(location.hostname)){DEMO=true;d=await getJSON(file)}
    else{fn(null,e);return}
  }
  $('demo').hidden=!DEMO;
  if(d?.updatedAt)$('updated').textContent='最終更新 '+String(d.updatedAt).replace('T',' ').slice(0,16);
  fn(d);
}
$('menu').addEventListener('click',()=>{const o=$('nav').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(o))});
$('nav').addEventListener('click',e=>{if(e.target.closest('a')){$('nav').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}});

const PALETTE=['#145ec9','#0f7a6b','#7b3fb5','#c0392b','#1d6fa5','#b35c00','#2e7d32','#ad1457','#37474f','#5d4dbf'];
function emblemUrl(e){
  e=String(e||'').trim();if(!e)return '';
  const d=e.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w400';
  if(/^https:\/\//i.test(e))return e;
  if(/^[^\/\\?#]+\.(png|jpe?g|webp|svg|gif)$/i.test(e))return './emblems/'+encodeURIComponent(e);
  return '';
}
/* 写真：ドライブの共有リンクは縮小版（幅 w px）にする。https の画像URLはそのまま */
function photoUrl(u,w){
  u=String(u||'').trim();if(!u)return '';
  const d=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  if(d)return 'https://drive.google.com/thumbnail?id='+d[1]+'&sz=w'+w;
  if(/^https:\/\//i.test(u))return u;
  return '';
}
const photoSet=(u,ws)=>/drive\.google\.com\/thumbnail/.test(photoUrl(u,ws[0]))?ws.map(w=>photoUrl(u,w)+' '+w+'w').join(', '):'';
function cover(t){
  const c=(crest(t).match(/--c:(#[0-9a-f]{3,8})/i)||[])[1]||'#145ec9',ph=photoUrl(t.teamPhoto,600),set=photoSet(t.teamPhoto,[400,600,900]);
  return ph?'<span class="cv photo" style="--c:'+c+'"><img src="'+esc(ph)+'"'+(set?' srcset="'+esc(set)+'" sizes="(max-width:680px) 50vw, 230px"':'')+' alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.remove(\'photo\');this.remove()"></span>':'<span class="cv" style="--c:'+c+'"></span>';
}
/* 大学のエンブレム：new/emblems/index.json（{"大学名":"ファイル名"}）。チーム紹介の「エンブレム」が空のときに使う */
let EMB={};
const embReady=fetch('./emblems/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(j=>{EMB=j&&typeof j==='object'?j:{}}).catch(()=>{});
function embFor(...names){for(const n of names){const f=n&&EMB[String(n).trim()];if(f&&/^[^\/\\?#]+\.(png|jpe?g|webp|svg|gif)$/i.test(f))return './emblems/'+encodeURIComponent(f)}return ''}
function crestFail(img){const s=img.parentNode;if(img.classList.contains('ed')){s.classList.remove('hasdark');img.remove();return}s.classList.remove('img','hasdark');s.querySelectorAll('img').forEach(x=>x.remove());s.insertBefore(document.createTextNode(s.dataset.ch),s.firstChild)}
/* 案①：同じ見た目（同じエンブレム・同じ文字）のチームが並ぶときだけ、名前の違う部分を小さな札にして付ける */
const BADGE=new Map();
const BADGE_WORDS={'セカンド':'2nd','サテライト':'SAT','サード':'3rd','トップ':'TOP'};
function makeBadges(teams,keyOf,labelOf){
  BADGE.clear();
  const g=new Map();
  for(const t of teams){
    const h=crestBase(t),u=(h.match(/<img[^>]*? src="([^"]+)"/)||[])[1];
    const look=u||'txt:'+((h.match(/>([^<]*)<\/span>$/)||[])[1]||'');
    if(!g.has(look))g.set(look,[]);g.get(look).push(t);
  }
  const tok=c=>/[0-9A-Za-z\-－]/.test(c||'');
  for(const ts of g.values()){
    if(ts.length<2)continue;
    const ns=ts.map(t=>[...String(labelOf(t)||'')]),min=Math.min(...ns.map(n=>n.length));
    let p=0;while(p<min&&ns.every(n=>n[p]===ns[0][p]))p++;
    while(p>0&&tok(ns[0][p-1])&&ns.some(n=>tok(n[p])))p--;
    let s=0;while(s<min-p&&ns.every(n=>n[n.length-1-s]===ns[0][ns[0].length-1-s]))s++;
    while(s>0&&ns.some(n=>tok(n[n.length-1-s]))&&tok(ns[0][ns[0].length-s]))s--;
    let out=ns.map(n=>{let x=n.slice(p,n.length-s).join('').replace(/[-－\s]/g,'');x=BADGE_WORDS[x]||x;return [...x].slice(0,3).join('')});
    if(out.some(x=>!x)||new Set(out).size<out.length)out=ts.map((_,i)=>String.fromCharCode(65+i));
    ts.forEach((t,i)=>BADGE.set(keyOf(t),out[i]));
  }
}
function addBadge(html,key){const b=BADGE.get(key);return b?html.replace(/<\/span>$/,'<i class="bdg">'+esc(b)+'</i></span>'):html}
function crest(t){return addBadge(crestBase(t),t.id)}
function crestInk(c){const m=/^#?([0-9a-f]{6})$/i.exec(String(c||''));if(!m)return '#fff';const n=parseInt(m[1],16),L=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*L[0]+.7152*L[1]+.0722*L[2]>.45?'#222':'#fff'}
function crestBase(t){
  const n=t.short||t.name||'';let h=0;for(const ch of String(t.id||n))h=(h*31+ch.charCodeAt(0))>>>0;
  let s=n.replace(/^(北海道|国立|私立)/,'').replace(/(大学|大)$/,'');if(![...s].length)s=n.replace(/大学$/,'大');
  const ch=[...s].slice(0,2).join('')||'?',two=[...ch].length>1;
  const c=/^#[0-9a-f]{3,8}$/i.test(t.color||'')?t.color:PALETTE[h%PALETTE.length],u=emblemUrl(t.emblem)||embFor(t.univ,t.name,t.short);
  if(u)return '<span class="crest img'+(two?' two':'')+'" style="--c:'+c+';color:'+crestInk(c)+'" data-ch="'+esc(ch)+'"><img src="'+esc(u)+'" alt="" loading="lazy" onerror="crestFail(this)"></span>';
  return '<span class="crest'+(two?' two':'')+'" style="--c:'+c+';color:'+crestInk(c)+'">'+esc(ch)+'</span>';
}
const sec=(id,en,ja,inner)=>'<section class="section" id="'+id+'"><div class="sechead"><h2><small>'+en+'</small>'+ja+'</h2></div>'+inner+'</section>';
boot('about.json',async(d)=>{
  await embReady;
  if(!d){$('main').innerHTML='<p class="empty">連盟の情報を読み込めませんでした。</p>';return}
  const parts=[];
  if(d.overview?.length)parts.push(['overview','OVERVIEW','連盟概要','<div class="ov">'+d.overview.map(o=>{const u=safeUrl(o.url);return '<article><h3>'+esc(o.title)+'</h3>'+(has(o.body)?'<p>'+richText(o.body)+'</p>':'')+(u?'<a class="lk" href="'+esc(u)+'" target="_blank" rel="noopener">詳しく見る ↗</a>':'')+'</article>'}).join('')+'</div>']);
  if(d.members?.length){
    const total=new Set(d.members.flatMap(l=>l.teams.map(t=>t.univ||t.name))).size;
    parts.push(['members','MEMBERS','加盟チーム','<p class="note" style="margin:-4px 2px 14px">'+total+'大学（今年度のリーグ戦の登録チーム）</p>'+d.members.map(l=>(makeBadges(l.teams,t=>t.id,t=>t.short||t.name),'')+'<div class="league"><h3>'+esc(shortComp(l.name))+'<span>'+l.teams.length+'チーム</span></h3><div class="clubs">'+
      l.teams.map(t=>'<a class="club" href="./team.html?comp='+encodeURIComponent(l.comp)+'&team='+encodeURIComponent(t.id)+'">'+cover(t)+crest(t)+'<div><strong>'+esc(t.name||t.short)+'</strong></div></a>').join('')+'</div></div>').join('')]);
  }
  const fileRow=o=>{const u=safeUrl(o.url),pdf=/\.pdf(\?|$)/i.test(u),tag=u?'a':'div';
    return '<'+tag+(u?' href="'+esc(u)+'" target="_blank" rel="noopener"':'')+'><span class="ic'+(pdf?' pdf':'')+'">'+(pdf?'PDF':u?'LINK':'INFO')+'</span><span><b>'+esc(o.title)+'</b>'+(has(o.body)?'<small>'+richText(o.body)+'</small>':'')+'</span>'+(u?'<span class="go">開く ↗</span>':'')+'</'+tag+'>'};
  if(d.documents?.length)parts.push(['documents','DOCUMENTS','書類・様式','<div class="card docs">'+d.documents.map(fileRow).join('')+'</div>']);
  if(d.links?.length)parts.push(['links','LINKS','関連リンク','<div class="card docs">'+d.links.map(fileRow).join('')+'</div>']);
  if(d.contact?.length)parts.push(['contact','CONTACT','お問い合わせ','<div class="ct">'+d.contact.map(o=>{const u=safeUrl(o.url);return '<div><h3>'+esc(o.title)+'</h3>'+(has(o.body)?'<p>'+richText(o.body)+'</p>':'')+(u?'<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">'+(/forms\.gle|docs\.google\.com\/forms/.test(u)?'フォームを開く':'開く')+' ↗</a>':'')+'</div>'}).join('')+'</div>']);
  if(!parts.length){$('main').innerHTML='<p class="empty">連盟の情報は準備中です。</p>';return}
  $('jump').innerHTML=parts.map(p=>'<a href="#'+p[0]+'">'+p[2]+'</a>').join('');
  $('main').innerHTML=parts.map(p=>sec(...p)).join('');
});

  return {ok:true,updatedAt:new Date().toISOString(),
    overview:[{title:'（サンプル）連盟について',body:'（サンプル）ここに連盟の目的や沿革が入ります。\n「連盟ページ」シートの「概要」に書いた内容がそのまま表示されます。',url:''},{title:'（サンプル）組織・役員',body:'（サンプル）会長・理事長・学生連盟など',url:''}],
    members:[{comp:'demo-1',name:'【サンプル】リーグ 1部',teams:T(8)},{comp:'demo-2',name:'【サンプル】リーグ 2部',teams:T(6).map(t=>({...t,id:t.id+'b',short:t.short+'2'}))}],
    documents:[{title:'（サンプル）チーム登録申請書',body:'毎年4月末まで',url:'https://example.com/a.pdf'},{title:'（サンプル）大会要項',body:'',url:'https://example.com'}],
    links:[{title:'（サンプル）全日本大学サッカー連盟',body:'',url:'https://example.com'}],
    contact:[{title:'お問い合わせ',body:'（サンプル）お問い合わせはフォームからお願いします。',url:'https://forms.gle/example'}]};
}
