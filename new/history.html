.crest.xl .bdg{min-width:28px;height:24px;padding:0 7px;border-radius:12px;font-size:15px;line-height:24px;right:-8px;bottom:-2px}

.ct{background:var(--navy);color:#fff;border-radius:16px;padding:26px 28px;display:grid;gap:18px}
.ct h3{margin:0 0 6px;font-size:17px}

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QS=new URLSearchParams(location.search);
const WD=['日','月','火','水','木','金','土'];
const md=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?(+m[2])+'月'+(+m[3])+'日':''};
$('menu').addEventListener('click',()=>{const o=$('nav').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(o))});
/* 大会の短い名前：「2025年度 第44回北海道学生サッカーリーグ 1部」→「1部」 */
const short=c=>{if(c.short)return c.short;const n=String(c.name||'');if(/-L(\d)$/.test(c.id))return n.match(/([0-9１-９]部)\s*$/)?.[1]||c.id.replace(/.*-L/,'')+'部';
  return n.replace(/^\d{4}年度\s*/,'').replace(/第\d+回\s*/,'').replace(/^北海道学生サッカー/,'').replace(/^北海道/,'').trim()||c.id};
const key=c=>String(c.id).replace(/^\d{4}-/,'');
let Y={},YEARS=[],SEL={y:QS.get('year')||'',c:QS.get('comp')||'L1'};
async function load(f){try{const r=await fetch('../results/data/history/'+f,{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}}
async function boot(){
  const idx=await load('index.json');
  const now=new Date().getFullYear(),ys=new Set((idx&&idx.years)||[]);
  for(let y=2026;y<=now+1;y++)ys.add(y);
  const got=await Promise.all([...ys].map(y=>load(y+'.json').then(d=>[y,d])));
  got.forEach(([y,d])=>{if(d&&d.competitions&&d.competitions.length)Y[y]=d});
  YEARS=Object.keys(Y).map(Number).sort((a,b)=>b-a);
  if(!YEARS.length){$('champs').innerHTML='<p class="empty">記録を読み込めませんでした。時間をおいて開き直してください。</p>';$('detail').innerHTML='';return}
  if(!Y[SEL.y])SEL.y=String(YEARS[0]);
  drawChamps();drawYear();
}
const l1=d=>d.competitions.find(c=>/-L1$/.test(c.id));
const topT=(d,n)=>{const t=d.standings&&d.standings[0]&&d.standings[0].table;return t&&t[n]?t[n].team:null};
function drawChamps(){
  $('champs').innerHTML='<div class="champ">'+YEARS.map(y=>{const c=l1(Y[y]);if(!c)return '';
    const w=c.finished?(c.champion||topT(c,0)):null,lead=!c.finished?topT(c,0):null;
    const kAw=(((c.awards||[]).find(a=>a.award==='得点王')||{}).list||[]).filter(p=>/^1部/.test(p.note||'')||!p.note),ks=(c.scorers||[]).length?(c.scorers||[]).filter(s=>s.rank===1):kAw.map(p=>({name:p.name,count:(String(p.note).match(/(\d+)点/)||[])[1]||''})),mvp=((c.awards||[]).find(a=>/最優秀選手|MVP/.test(a.award))||{}).list||[];
    const sub=[c.finished&&topT(c,1)?'2位 '+topT(c,1).name:'',ks.length&&c.finished&&(c.scorersNote||!(c.scorersAsOf&&c.asOf&&c.scorersAsOf<c.asOf))?'得点王 '+ks.map(s=>s.name+'（'+s.count+'点）').join('・'):'',mvp.length?'MVP '+mvp.map(p=>p.name).join('・'):''].filter(Boolean);
    return `<a href="?year=${y}&comp=L1#yearSec" data-y="${y}"><div class="y">${y}<small>${c.finished?'':'シーズン中'}</small></div>
      <div class="w">${w?'<b>優勝</b>'+esc(w.name):lead?'<b>首位</b>'+esc(lead.name)+'<span class="ing">'+esc(md(c.asOf))+'時点</span>':'—'}</div>
      ${sub.length?`<div class="s">${sub.map(esc).join('<br>')}</div>`:''}</a>`}).join('')+'</div>';
  $('champs').onclick=e=>{const a=e.target.closest('[data-y]');if(!a)return;e.preventDefault();SEL.y=a.dataset.y;SEL.c='L1';drawYear();$('yearSec').scrollIntoView()};
}
function drawYear(){
  $('years').innerHTML=YEARS.map(y=>`<button role="tab" aria-selected="${String(y)===SEL.y}" data-y="${y}">${y}年度</button>`).join('');
  $('years').onclick=e=>{const b=e.target.closest('[data-y]');if(!b)return;SEL.y=b.dataset.y;drawYear()};
  const on=$('years').querySelector('[aria-selected=true]');if(on)$('years').scrollLeft=on.offsetLeft-$('years').offsetLeft-16;
  const d=Y[SEL.y],cs=d.competitions;
  if(!cs.some(c=>key(c)===SEL.c))SEL.c=key(cs.find(c=>/-L1$/.test(c.id))||cs[0]);
  $('comps').innerHTML=cs.length>1?cs.map(c=>`<button role="tab" aria-selected="${key(c)===SEL.c}" data-c="${esc(key(c))}">${esc(short(c))}</button>`).join(''):'';
  $('comps').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;SEL.c=b.dataset.c;drawYear()};
  drawComp(cs.find(c=>key(c)===SEL.c));
  try{history.replaceState(null,'','?year='+SEL.y+'&comp='+encodeURIComponent(SEL.c))}catch(e){}
  if(d.updatedAt)$('updated').textContent='最終更新 '+String(d.updatedAt).replace('T',' ').slice(0,16);
}
/* 試合の一覧からトーナメント表を作る：決勝から、両チームが勝ち上がってきた前の試合をたどる */
function bracket(ms){
  const nm=t=>t&&t.name||'';
  const win=m=>m.winner==='home'?nm(m.home):m.winner==='away'?nm(m.away):'';
  const fin=[...ms].reverse().find(m=>m.round==='決勝')||null;
  if(!fin)return null;
  const used=new Set(),idx=new Map(ms.map((m,i)=>[m,i]));
  const node=(m,depth)=>{
    used.add(m);
    const kid=team=>{const prev=ms.filter(x=>!used.has(x)&&idx.get(x)<idx.get(m)&&win(x)===team&&!/3位|順位/.test(x.round||'')).pop();return prev&&depth<8?node(prev,depth+1):null};
    const ka=kid(nm(m.home)),kb=kid(nm(m.away));
    // 両チームともこの試合から出るとき（1回戦など）は、外に名前を出さない。片方だけのとき（シード）は名前の札を出す
    const leaf=t=>`<div class="bkl">${esc(nm(t))}</div>`;
    const kids=ka||kb?`<div class="bkk"><div class="bkc">${ka||leaf(m.home)}</div><div class="bkc">${kb||leaf(m.away)}</div></div>`:'';
    const sc=String(m.score||'').match(/^(\d+)-(\d+)(.*)$/);
    const row=(t,side,v)=>`<div class="t${m.winner===side?' w':''}"><span>${esc(nm(t))}</span><b>${esc(v)}</b></div>`;
    const box=`<div class="bkm${kids?'':' first'}"><div class="r">${esc(m.round||'')}${m.date?'　'+esc(md(m.date)):''}</div>${sc?row(m.home,'home',sc[1])+row(m.away,'away',sc[2]):row(m.home,'home',m.winner==='home'?'○':'')+row(m.away,'away',m.winner==='away'?'○':'')}${m.pk?`<div class="pk">PK ${esc(m.pk)}</div>`:sc&&sc[3]?`<div class="pk">${esc(sc[3])}</div>`:!sc&&m.score?`<div class="pk">${esc(m.score)}</div>`:''}</div>`;
    return `<div class="bkn${depth?'':' root'}">${kids}${box}</div>`;
  };
  return {html:node(fin,0),used};
}
function drawComp(c){
  let h=`<div class="yh"><h3>${esc(c.name)}</h3><span class="sub">${c.finished?(c.champion?'優勝：'+esc(c.champion.name):'最終結果'):'シーズン中'+(c.asOf?'（'+esc(md(c.asOf))+'時点）':'')}</span></div>`;
  (c.standings||[]).forEach((g,gi)=>{
    h+=`<div class="block">${g.group?`<h4>${esc(g.group)}${/グループ|組|ブロック|リーグ|順位/.test(g.group)?'':'グループ'}</h4>`:'<h4>順位表</h4>'}<div class="card tw"><table class="ht"><tr><th>順位</th><th class="l">チーム</th><th>試合</th><th>勝点</th><th>勝</th><th>分</th><th>敗</th><th>得点</th><th>失点</th><th>得失点</th></tr>
      ${g.table.map(r=>`<tr${r.rank===1&&c.finished&&(gi===0||!/予選/.test(g.group))?' class="top1"':''}><td><span class="rk${r.rank===1?' r1':''}">${esc(r.rank)}</span></td><td class="l"><b>${esc(r.team&&r.team.name)}</b>${r.note?`<div class="note" style="margin:2px 0 0">${esc(r.note)}</div>`:''}</td><td class="num">${esc(r.played)}</td><td class="pts">${esc(r.points)}</td><td class="num">${esc(r.won)}</td><td class="num">${esc(r.drawn)}</td><td class="num">${esc(r.lost)}</td><td class="num">${esc(r.goalsFor)}</td><td class="num">${esc(r.goalsAgainst)}</td><td class="num">${r.goalDiff>0?'+':''}${esc(r.goalDiff)}</td></tr>`).join('')}</table></div></div>`;
  });
  let rest=c.matches||[];
  if(c.format==='トーナメント'&&rest.length){const bk=bracket(rest);if(bk){h+=`<div class="block"><h4>トーナメント表<span class="note" style="margin-left:8px">右が決勝。赤い字が勝ったチーム</span></h4><div class="card bk">${bk.html}</div></div>`;rest=rest.filter(m=>!bk.used.has(m));if(rest.length)h+='<div class="note" style="margin:4px 2px 0">ほかの試合（順位決定戦など）は下にあります。</div>';}}
  if(rest.length){
    const rs=[];rest.forEach(m=>{const k=m.group?m.group+'グループ':m.round;let r=rs.find(x=>x.k===k);if(!r)rs.push(r={k,list:[]});r.list.push(m)});
    h+=`<div class="block"><h4>${c.format==='トーナメント'?'ほかの試合':'試合結果'}</h4><div class="card mt" style="padding:4px 16px 8px">${rs.reverse().map(r=>`<div class="rd">${esc(r.k)}</div>${r.list.map(m=>`<div class="m"><span class="h">${m.winner==='home'?'<b class="win">':'<b>'}${esc(m.home&&m.home.name)}</b></span><span class="sc">${esc(m.score)}${m.pk?`<small>PK ${esc(m.pk)}</small>`:''}</span><span class="a">${m.winner==='away'?'<b class="win">':'<b>'}${esc(m.away&&m.away.name)}</b></span></div>`).join('')}`).join('')}</div></div>`;
  }
  (c.playoffs||[]).forEach(p=>{
    h+=`<div class="block po"><h4>${esc(p.title)}<span class="note" style="margin-left:8px">${esc(md(p.date))}${p.venue?'・'+esc(p.venue):''}</span></h4>${p.matches.map(m=>`<div class="card">${esc(m.home.name)} <small>（${esc(m.homeNote)}）</small><span class="sc">${esc(m.score)}</span>${esc(m.away.name)} <small>（${esc(m.awayNote)}）</small>${m.half?`<div class="note">${esc(m.half)}</div>`:''}</div>`).join('')}</div>`;
  });
  if(c.notes&&c.notes.length)h+=`<div class="note">${c.notes.map(n=>'※'+esc(n)).join('<br>')}</div>`;
  const scT=(title,sub,list)=>`<div class="block"><h4>${esc(title)}<span class="note" style="margin-left:8px">${sub}</span></h4><div class="card tw"><table class="ht" style="min-width:0"><tr><th>順位</th><th class="l">選手</th><th class="l">チーム</th><th>得点</th></tr>
      ${list.map(s=>`<tr><td><span class="rk${s.rank===1?' r1':''}">${esc(s.rank)}</span></td><td class="l"><b>${esc(s.name)}</b></td><td class="l" style="white-space:normal;color:var(--muted)">${esc(s.team)}</td><td class="pts">${esc(s.count)}</td></tr>`).join('')}</table></div></div>`;
  if(c.scorers&&c.scorers.length){
    const asOf=c.scorersAsOf||c.asOf,early=!c.scorersNote&&c.scorersAsOf&&c.asOf&&c.scorersAsOf<c.asOf;
    h+=scT('得点ランキング',c.scorersNote?esc(c.scorersNote):(asOf?esc(md(asOf))+'時点':'')+(early?'（最終ではありません）':''),c.scorers);
  }
  (c.scorerTables||[]).forEach(t=>{h+=scT('得点ランキング（'+t.title+'）',t.asOf?esc(md(t.asOf))+'時点':'',t.list)});
  if(c.awards&&c.awards.length){
    h+=`<div class="block"><h4>個人表彰</h4><div class="aw">${c.awards.map(a=>`<div class="card"><h5>${esc(a.award)}</h5><ul>${a.list.map(p=>`<li><span class="p">${esc(p.pos)}</span><span class="n">${esc(p.name)}${p.note?` <small style="color:var(--muted)">${esc(p.note)}</small>`:''}</span><span class="t">${esc(p.team)}</span></li>`).join('')}</ul></div>`).join('')}</div></div>`;
  }
  if(!c.standings&&!(c.matches&&c.matches.length)&&!(c.awards&&c.awards.length))h+='<p class="empty">まだ結果がありません。</p>';
  $('detail').innerHTML=h;
}
boot();
</script>
<script src="./hit.js" defer></script>
