<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>北海道学生サッカー 日程・結果</title>
<meta name="description" content="北海道学生サッカー連盟の大会の日程・結果・順位表・得点ランキング">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<!--
  results/index.html（GitHub Pages版のホームページ）
  中身は PublicSite.html v2 と同じ。データは全体システムが書き出した data/*.json を読む（StaticSite.gs）
  ?comp=2027-L1 で大会を、&match=試合ID で試合を指定して開ける
  ---- 以下、元の説明 ----
  PublicSite.html v2（公開サイト）2026-09-28
  v2：節の選択・試合詳細（公式記録）・トーナメント表・警告退場の一覧表（Jリーグ形式）
  WebアプリURL + ?page=public（&comp=2026-L1 で大会を指定して開ける）
  データは Code.gs の getPublicData（PublicApi.gs）から取得。メール・電話・処分理由などは含まない
  配色：#1976D2 / #D84315 / #E8F4FB / #222222 / #888888 / #E0E0E0 / 背景 #FFFFFF
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1976D2;--red:#D84315;--pale:#E8F4FB;--ink:#222222;--sub:#888888;--line:#E0E0E0;--bg:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top{max-width:1080px;margin:0 auto;padding:12px 16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
h1 img{height:32px;width:auto;display:block}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 28px 6px 10px;min-height:38px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:right 13px center,right 8px center;background-size:5px 5px;background-repeat:no-repeat}
nav{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);padding:10px 10px;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}
.bar .note{color:var(--sub);font-size:12px;margin-left:auto}
h2{font-size:14px;font-weight:700;margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2 small{color:var(--sub);font-weight:400;margin-left:8px}
.empty{color:var(--sub);padding:24px 0;text-align:center}
.badge{display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border:1px solid var(--red);color:var(--red);border-radius:4px;margin-right:4px;vertical-align:1px}
/* 日程 */
.m{display:grid;grid-template-columns:64px 1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.m .t{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.m .h{text-align:right}.m .a{text-align:left}
.m .team{font-weight:500}
.m .team.win{font-weight:700}
.m .sc{min-width:72px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.m .sc.pend{color:var(--sub);font-weight:400;font-size:13px}
.m .sc small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.m .meta{grid-column:2 / 5;color:var(--sub);font-size:12px;margin-top:-4px}
.m.tbd .h{grid-column:2 / 5;text-align:left;color:var(--sub)}
@media (max-width:560px){
  .m{grid-template-columns:1fr auto 1fr}
  .m .t{grid-column:1 / 4}
  .m .meta{grid-column:1 / 4}
  .m.tbd .h{grid-column:1 / 4}
}
/* 表 */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;white-space:nowrap}
.tbl th{font-size:12px;color:var(--sub);font-weight:500}
.tbl td.l,.tbl th.l{text-align:left}
.tbl td.pts{font-weight:700;color:var(--blue)}
.tbl tr.me td{background:var(--pale)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid td{font-size:13px;min-width:64px}
.grid td.self{background:var(--pale)}
.grid .w{color:var(--ink);font-weight:700}.grid .l{color:var(--sub)}.grid .d{color:var(--ink)}
.grid .up{color:var(--sub);font-size:11px}
.sub{color:var(--sub);font-size:12px}
.sus{color:var(--red);font-weight:700}
.foot{color:var(--sub);font-size:12px;margin-top:32px}
.loading{color:var(--sub);padding:40px 0;text-align:center}
@media (max-width:560px){.hide-sp{display:none}h1{font-size:15px;min-width:0}.top select{max-width:48%}}
/* 試合行（押せる） */
.m.link{cursor:pointer}
.m.link:hover .sc{color:var(--blue)}
.m .go{grid-column:4;justify-self:end;color:var(--blue);font-size:12px}
/* 試合詳細 */
.back{font:inherit;font-size:14px;background:none;border:0;color:var(--blue);padding:12px 0;cursor:pointer}
.mh{text-align:center;padding:8px 0 16px;border-bottom:1px solid var(--line)}
.mh .meta{color:var(--sub);font-size:13px}
.mh .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:12px 0 4px}
.mh .tn{font-size:18px;font-weight:700}
.mh .tn.h{text-align:right}.mh .tn.a{text-align:left}
.mh .big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.mh .half{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.tl{margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:1fr 56px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.tl .min{text-align:center;color:var(--sub);font-variant-numeric:tabular-nums}
.tl .h{text-align:right}
.ico{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin:0 4px}
.ico.c{background:#F2C200}.ico.s{background:var(--red)}
.goal{font-weight:700}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.lu{grid-template-columns:1fr}}
.lu h3{font-size:13px;margin:12px 0 4px;color:var(--sub);font-weight:500}
.lu table{width:100%;border-collapse:collapse;font-size:14px}
.lu td{padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.lu td.no{width:32px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.lu td.ps{width:32px;color:var(--sub);font-size:12px}
.lu .ev{color:var(--sub);font-size:12px;margin-left:6px}
.lu .in{color:var(--blue)}.lu .out{color:var(--sub)}
.off{font-size:14px}
.off span{color:var(--sub);display:inline-block;min-width:56px}
/* トーナメント表 */
.bkwrap{overflow-x:auto;padding:8px 0 16px}
.bn{display:flex;align-items:center}
.kids{display:flex;flex-direction:column}
.kid{position:relative;padding:4px 24px 4px 0}
.kid::after{content:'';position:absolute;right:12px;top:50%;width:12px;border-top:1px solid var(--line)}
.kid::before{content:'';position:absolute;right:12px;top:0;bottom:0;border-right:1px solid var(--line)}
.kid:first-child::before{top:50%}
.kid:last-child::before{bottom:50%}
.kid:only-child::before{display:none}
.bm{position:relative;border:1px solid var(--line);border-radius:6px;min-width:150px;font-size:13px;background:var(--bg)}
.kids+.bm::before{content:'';position:absolute;left:-13px;top:50%;width:12px;border-top:1px solid var(--line)}
.bm.link{cursor:pointer}.bm.link:hover{border-color:var(--blue)}
.bm .r{display:flex;justify-content:space-between;gap:8px;padding:4px 8px}
.bm .r+.r{border-top:1px solid var(--line)}
.bm .r.w{font-weight:700}
.bm .r .s{font-variant-numeric:tabular-nums}
.bm .r.tbd{color:var(--sub)}
.bm .d{font-size:11px;color:var(--sub);padding:2px 8px;border-top:1px solid var(--line);background:var(--pale);white-space:nowrap}
.leaf{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;min-width:110px}
/* 警告・退場（表） */
.ct{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ct th,.ct td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
.ct th{background:var(--pale);font-weight:500;font-size:11px;color:var(--ink)}
.ct td.l,.ct th.l{text-align:left;position:sticky;left:0;background:var(--bg)}
.ct th.l{background:var(--pale)}
.ct td.cc{background:#F2C200;color:var(--ink);font-weight:700}
.ct td.ss{background:var(--red);color:#fff;font-weight:700}
.ct td.stop{background:var(--ink);color:#fff;font-weight:700}
.ct td.stop.done{background:var(--bg);color:var(--sub);border:1px solid var(--sub)}
.ct .rd{display:block;font-weight:700}
.ct .opp{display:block;font-size:10px;color:var(--sub)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 16px;font-size:12px;margin:4px 0 8px}
.codes b{display:inline-block;min-width:2.2em}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><img src="logo.png" alt="JUFA Hokkaido"><span id="siteName">日程・結果</span></h1>
    <select id="comp" aria-label="大会"></select>
  </div>
  <nav id="tabs"></nav>
</header>
<div class="wrap" id="main"><div class="loading">読み込み中…</div></div>

<script>
const QS = new URLSearchParams(location.search);
const INITIAL_COMP = QS.get('comp') || '';
const TABS = [
  ['schedule','日程・結果',()=>true],
  ['standings','順位表',d=>d.groups&&d.groups.length],
  ['grid','星取表',d=>d.grid&&d.grid.length],
  ['tournament','トーナメント',d=>d.rounds&&d.rounds.length],
  ['scorers','得点',d=>d.scorers&&d.scorers.length],
  ['assists','アシスト',d=>d.assists&&d.assists.length],
  ['cards','警告・退場',d=>d.cards&&d.cards.length]
];
let COMPS=[], DATA=null, TAB='schedule', TEAM='', ROUND='', CTEAM='', DETAIL=null, INITIAL_MATCH='';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W='日月火水木金土';
const jd=ymd=>{const m=String(ymd||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return ymd||'';const d=new Date(+m[1],+m[2]-1,+m[3]);return `${+m[2]}月${+m[3]}日（${W[d.getDay()]}）`;};
const sd=ymd=>{const m=String(ymd||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return '';const d=new Date(+m[1],+m[2]-1,+m[3]);return `${+m[2]}/${+m[3]}(${W[d.getDay()]})`;};
// データ：全体システムが書き出した JSON（data/）を読む。同じファイルは1回だけ読む
const JCACHE={};
const getJSON=f=>JCACHE[f]||(JCACHE[f]=fetch('data/'+f,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('データを読み込めませんでした（'+r.status+'）');return r.json();}).catch(e=>{delete JCACHE[f];throw e;}));
const run=p=>{
  if(p.api==='competitions')return getJSON('competitions.json');
  if(p.api==='all')return getJSON(encodeURIComponent(p.comp)+'.json');
  if(p.api==='match')return getJSON(encodeURIComponent(p.comp)+'-matches.json').then(d=>{
    const det=d.details&&d.details[p.match];
    if(det)return {ok:true,detail:det};
    const m=(DATA&&DATA.matches||[]).find(x=>x.matchId===p.match);
    return m?{ok:true,detail:{match:m,source:'none',info:null,halves:null,goals:[],cards:[],subs:[],lineups:null,pk:null}}:{ok:false,error:'試合が見つかりません'};
  });
  return Promise.reject(new Error('不明なデータです'));
};
const setQS=(comp,match)=>{try{const q=new URLSearchParams();if(comp)q.set('comp',comp);if(match)q.set('match',match);history.replaceState(null,'','?'+q.toString());}catch(e){}};

function init(){
  INITIAL_MATCH=QS.get('match')||'';
  run({api:'competitions'}).then(r=>{
    COMPS=r.competitions||[];
    $('comp').innerHTML=COMPS.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    const first=COMPS.find(c=>c.id===INITIAL_COMP)||COMPS[0];
    if(!first){$('main').innerHTML='<div class="empty">公開中の大会はありません</div>';return;}
    $('comp').value=first.id; load(first.id);
  }).catch(showErr);
  $('comp').addEventListener('change',e=>{TEAM='';ROUND='';CTEAM='';DETAIL=null;load(e.target.value);});
}
function load(comp){
  setQS(comp,'');
  $('main').innerHTML='<div class="loading">読み込み中…</div>';
  run({api:'all',comp}).then(d=>{
    if(!d.ok) return showErr({message:d.error});
    DATA=d;
    const avail=TABS.filter(t=>t[2](d));
    if(!avail.some(t=>t[0]===TAB)) TAB='schedule';
    $('tabs').innerHTML=avail.map(t=>`<button type="button" data-tab="${t[0]}" class="${t[0]===TAB?'on':''}">${t[1]}</button>`).join('');
    if(INITIAL_MATCH){const id=INITIAL_MATCH;INITIAL_MATCH='';openMatch(id);return;}
    render();
  }).catch(showErr);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('#tabs button');
  if(b){TAB=b.dataset.tab;DETAIL=null;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render();window.scrollTo(0,0);return;}
  const m=e.target.closest('[data-match]');
  if(m){openMatch(m.dataset.match);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const m=e.target.closest&&e.target.closest('[data-match]');if(m)openMatch(m.dataset.match);}});
let SCROLL_Y=0;
function showErr(e){$('main').innerHTML=`<div class="empty">読み込めませんでした。時間をおいて再度お試しください。<br><span class="sub">${esc(e&&e.message||e)}</span></div>`;}

function render(){
  const f={schedule:rSchedule,standings:rStandings,grid:rGrid,tournament:rTournament,scorers:()=>rRanking(DATA.scorers,'得点'),assists:()=>rRanking(DATA.assists,'アシスト'),cards:rCards}[TAB];
  $('main').innerHTML=f()+`<div class="foot">更新：${esc(String(DATA.updatedAt||'').replace('T',' ').slice(0,16))}　／　${esc(DATA.competition.name)}　／　v2</div>`;
  const ts=$('teamSel');
  if(ts) ts.addEventListener('change',e=>{TEAM=e.target.value;render();});
  const rs=$('roundSel');
  if(rs) rs.addEventListener('change',e=>{ROUND=e.target.value;render();});
  const cs=$('cteamSel');
  if(cs) cs.addEventListener('change',e=>{CTEAM=e.target.value;render();});
}

/* ---------- 日程・結果 ---------- */
function teamsOf(){
  const m={};(DATA.matches||[]).forEach(x=>{[x.home,x.away].forEach(t=>{if(t)m[t.id]=t;});});
  return Object.values(m).sort((a,b)=>a.short.localeCompare(b.short,'ja'));
}
function rSchedule(){
  const rounds=[...new Set((DATA.matches||[]).map(m=>m.round).filter(Boolean))];
  if(ROUND&&!rounds.includes(ROUND))ROUND='';
  const list=(DATA.matches||[]).filter(m=>(!TEAM||(m.home&&m.home.id===TEAM)||(m.away&&m.away.id===TEAM))&&(!ROUND||m.round===ROUND));
  const bar=`<div class="bar"><select id="roundSel" aria-label="節"><option value="">すべての節</option>${rounds.map(r=>`<option${r===ROUND?' selected':''}>${esc(r)}</option>`).join('')}</select>
    <select id="teamSel" aria-label="チーム"><option value="">すべてのチーム</option>${teamsOf().map(t=>`<option value="${esc(t.id)}"${t.id===TEAM?' selected':''}>${esc(t.short)}</option>`).join('')}</select>
    <span class="note">${list.filter(m=>m.status==='finished').length} / ${list.length} 試合終了</span></div>`;
  if(!list.length) return bar+'<div class="empty">試合はありません</div>';
  // 節ごと → 日付ごと
  const groups=[];list.forEach(m=>{const k=m.round;let g=groups.find(x=>x.k===k);if(!g){g={k,items:[]};groups.push(g);}g.items.push(m);});
  return bar+groups.map(g=>{
    const dates=[...new Set(g.items.map(m=>m.date))];
    return `<h2>${esc(g.k)}<small>${dates.map(jd).join('・')}</small></h2>`+g.items.map(mRow).join('');
  }).join('');
}
function mRow(m){
  const badges=(m.badges||[]).map(b=>`<span class="badge">${esc(b)}</span>`).join('');
  const meta=[jd(m.date),m.no?'No.'+m.no:'',m.venue,m.host?'当番校 '+m.host:''].filter(Boolean).map(esc).join('　');
  if(!m.home||!m.away){
    return `<div class="m tbd"><span class="t">${esc(m.kickoff||'')}</span><span class="h">${badges}${esc(m.placeholder||'未定')}</span><div class="meta">${meta}</div></div>`;
  }
  let sc;
  if(m.score){
    const pk=m.score.pk?`<small>PK ${m.score.pk.home}-${m.score.pk.away}</small>`:m.score.extraTime?'<small>延長</small>':'';
    sc=`<span class="sc">${m.score.home} - ${m.score.away}${pk}</span>`;
  }else{
    const st={suspended:'中断',postponed:'延期',cancelled:'中止',unrecorded:'結果未登録'}[m.status]||'vs';
    sc=`<span class="sc pend">${st}</span>`;
  }
  const w=id=>m.winner===id?' win':'';
  const link=!!m.score;
  return `<div class="m${link?' link':''}"${link?` data-match="${esc(m.matchId)}" role="button" tabindex="0" aria-label="試合の詳細"`:''}><span class="t">${esc(m.kickoff||'')}</span>
    <span class="h team${w(m.home.id)}">${esc(m.home.short)}</span>${sc}<span class="a team${w(m.away.id)}">${esc(m.away.short)}</span>
    <div class="meta">${badges}${meta}${link?'　<span style="color:var(--blue)">試合詳細 ›</span>':''}</div></div>`;
}

/* ---------- 順位表 ---------- */
function rStandings(){
  return (DATA.groups||[]).map(g=>{
    const fp=g.table.some(r=>r.fairPlay!=null), rate=g.table.some(r=>r.pointsRate!=null);
    return `${g.group?`<h2>${esc(g.group)}</h2>`:'<div style="height:16px"></div>'}<div class="scroll"><table class="tbl">
      <tr><th>順位</th><th class="l">チーム</th><th>勝点</th><th>試合</th><th>勝</th><th>分</th><th>敗</th><th class="hide-sp">得点</th><th class="hide-sp">失点</th><th>得失点</th>${rate?'<th>勝点率</th>':''}${fp?'<th>FP</th>':''}</tr>
      ${g.table.map(r=>`<tr><td>${r.rank}</td><td class="l">${esc(r.team.short)}</td><td class="pts">${r.points}</td><td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td>
        <td class="hide-sp">${r.goalsFor}</td><td class="hide-sp">${r.goalsAgainst}</td><td>${r.goalDiff>0?'+':''}${r.goalDiff}</td>${rate?`<td>${r.pointsRate??''}</td>`:''}${fp?`<td>${r.fairPlay??''}</td>`:''}</tr>`).join('')}
    </table></div>${g.table.some(r=>r.note)?`<p class="sub">${g.table.filter(r=>r.note).map(r=>esc(r.team.short+'：'+r.note)).join('　')}</p>`:''}`;
  }).join('')+'<p class="sub">順位は勝点・得失点差・総得点・当該チーム同士の勝敗の順で決定（大会要項による）</p>';
}

/* ---------- 星取表 ---------- */
function rGrid(){
  return (DATA.grid||[]).map(g=>`${g.group?`<h2>${esc(g.group)}</h2>`:'<div style="height:16px"></div>'}<div class="scroll"><table class="tbl grid">
    <tr><th class="l"></th>${g.teams.map(t=>`<th>${esc(t.short)}</th>`).join('')}</tr>
    ${g.rows.map((r,i)=>`<tr><td class="l"><b>${esc(r.team.short)}</b></td>${r.cells.map((c,j)=>{
      if(c===null) return '<td class="self"></td>';
      return '<td>'+c.map(x=>x.result?`<div class="${x.result.toLowerCase()}">${{W:'○',L:'●',D:'△'}[x.result]} ${x.for}-${x.against}</div>`:`<div class="up">${esc(jd(x.date).replace(/（.）/,''))}</div>`).join('')+'</td>';
    }).join('')}</tr>`).join('')}
  </table></div>`).join('')+'<p class="sub">○勝ち　●負け　△引き分け（左のチームから見た結果）</p>';
}

/* ---------- トーナメント ---------- */
function rTournament(){
  const rounds=(DATA.rounds||[]);
  const main=rounds.filter(r=>!/3位/.test(r.round));
  const third=rounds.filter(r=>/3位/.test(r.round));
  const tree=buildBracket(main);
  const list=rounds.map(r=>`<h2>${esc(r.round)}</h2>${r.matches.map(mRow).join('')}`).join('');
  if(!tree)return list;
  return `<div class="bkwrap">${bNode(tree)}</div>`+
    (third.length?`<h2>${esc(third[0].round)}</h2><div class="bkwrap">${third[0].matches.map(m=>bMatch(m)).join('')}</div>`:'')+
    `<details style="margin-top:16px"><summary class="sub" style="cursor:pointer">試合一覧で見る</summary>${list}</details>`;
}
function buildBracket(rounds){
  if(!rounds.length)return null;
  const last=rounds[rounds.length-1];
  if(last.matches.length!==1)return null;
  const idx={};rounds.forEach((r,i)=>r.matches.forEach(m=>idx[m.matchId]=i));
  const byNo={};rounds.forEach(r=>r.matches.forEach(m=>{if(m.no)byNo[String(m.no)]=m;}));
  const used={};
  const node=(m)=>{
    used[m.matchId]=true;
    const ri=idx[m.matchId];
    const kids=[];
    const findPrev=(team)=>{
      for(let i=ri-1;i>=0;i--){
        const p=rounds[i].matches.find(x=>!used[x.matchId]&&x.home&&x.away&&(x.home.id===team.id||x.away.id===team.id));
        if(p)return p;
      }
      return null;
    };
    if(m.home&&m.away){
      [m.home,m.away].forEach(t=>{const p=findPrev(t);kids.push(p?node(p):{leaf:t});});
    }else{
      const refs=(String(m.placeholder||'')+' '+String(m.note||'')).match(/No\.?\s?(\d+)/g)||[];
      const found=refs.map(x=>byNo[x.replace(/\D/g,'')]).filter(p=>p&&!used[p.matchId]&&idx[p.matchId]<ri);
      if(found.length)found.forEach(p=>kids.push(node(p)));
      else if(ri>0){
        // 対戦が決まっていない：直前のラウンドから順番に2試合
        rounds[ri-1].matches.filter(x=>!used[x.matchId]).slice(0,2).forEach(p=>kids.push(node(p)));
      }
    }
    // どちらも前の試合がない（この試合から出場）ときは、チーム名の枠を出さない
    return {m,kids:kids.every(k=>k.leaf)?[]:kids};
  };
  return node(last.matches[0]);
}
function bNode(n){
  if(n.leaf)return `<div class="leaf">${esc(n.leaf.short)}</div>`;
  const kids=n.kids.length?`<div class="kids">${n.kids.map(k=>`<div class="kid">${bNode(k)}</div>`).join('')}</div>`:'';
  return `<div class="bn">${kids}${bMatch(n.m)}</div>`;
}
function bMatch(m){
  const sc=m.score;
  const row=(t,s,pk,win)=>`<div class="r${win?' w':''}${t?'':' tbd'}"><span>${esc(t?t.short:'未定')}</span><span class="s">${s==null?'':s}${pk!=null?` <small>(${pk})</small>`:''}</span></div>`;
  const hw=sc&&m.home&&m.winner===m.home.id, aw=sc&&m.away&&m.winner===m.away.id;
  return `<div class="bm${sc?' link':''}"${sc?` data-match="${esc(m.matchId)}"`:''}>`+
    row(m.home,sc?sc.home:null,sc&&sc.pk?sc.pk.home:null,hw)+row(m.away,sc?sc.away:null,sc&&sc.pk?sc.pk.away:null,aw)+
    `<div class="d">${esc(m.round)}${m.no?'・No.'+esc(m.no):''}　${esc(sd(m.date))}</div></div>`;
}

/* ---------- ランキング ---------- */
function rRanking(list,label){
  if(!list||!list.length) return '<div class="empty">記録はありません</div>';
  return `<div style="height:16px"></div><table class="tbl"><tr><th>順位</th><th class="l">選手</th><th class="l">チーム</th><th>${label}</th></tr>
    ${list.slice(0,50).map(r=>`<tr><td>${r.rank}</td><td class="l">${esc(r.name)}</td><td class="l">${esc(r.team&&r.team.short||'')}</td><td class="pts">${r.count}</td></tr>`).join('')}</table>`;
}

/* ---------- 警告・退場 ---------- */
function rCards(){
  const list=DATA.cards||[];
  const tables=DATA.cardTable||[];
  const byId={};(DATA.matches||[]).forEach(m=>byId[m.matchId]=m);
  const sus=list.filter(p=>p.suspendedFor&&p.suspendedFor.length)
    .sort((a,b)=>String(a.team&&a.team.univ||'').localeCompare(String(b.team&&b.team.univ||''),'ja')||(Number(a.no)||999)-(Number(b.no)||999));
  const rdShort=r=>{const x=String(r||'').match(/第\d+節/);return x?x[0]:String(r||'');};
  const susTxt=p=>p.suspendedFor.map(id=>{const m=byId[id];return m&&m.home?`${jd(m.date)}　${rdShort(m.round)}　${m.home.short} vs ${m.away.short}`:id;}).map(esc).join('<br>');
  const top=sus.length?`<h2>出場停止（これからの試合）</h2><div class="scroll"><table class="tbl"><tr><th class="l">大学名</th><th>背番号</th><th class="l">名前</th><th class="l">対象試合</th></tr>
      ${sus.map(p=>`<tr><td class="l">${esc(p.team&&(p.team.univ||p.team.short)||'')}</td><td>${esc(p.no||'')}</td><td class="l sus">${esc(p.name)}</td><td class="l">${susTxt(p)}</td></tr>`).join('')}</table></div>`:'';
  const bar=`<div class="bar"><select id="cteamSel" aria-label="チーム"><option value="">すべてのチーム</option>${tables.map(t=>`<option value="${esc(t.team.id)}"${t.team.id===CTEAM?' selected':''}>${esc(t.team.short)}</option>`).join('')}</select></div>`;
  const shown=tables.filter(t=>!CTEAM||t.team.id===CTEAM);
  const md=d=>{const x=String(d||'').match(/\d{4}-(\d{2})-(\d{2})/);return x?`${+x[1]}/${+x[2]}`:'';};
  const body=shown.map(t=>{
    const cols=t.matches;
    return `<h2>${esc(t.team.name||t.team.short)}</h2><div class="scroll"><table class="ct">
      <tr><th class="l">No.</th><th class="l">選手</th><th>警告</th><th>退場</th>${cols.map(c=>`<th><span class="rd">${esc(rdShort(c.round))}</span>${esc(md(c.date))}<span class="opp">${c.home?'':'@'}${esc(c.opp)}</span></th>`).join('')}</tr>
      ${t.players.map(p=>`<tr><td class="l" style="left:0">${esc(p.no)}</td><td class="l">${esc(p.name)}</td><td>${p.c||''}</td><td>${p.s||''}</td>${cols.map(c=>{
        const v=p.cells[c.matchId]||[];
        if(v.includes('停止')){const done=(p.suspended||[]).some(x=>x.matchId===c.matchId&&x.done);return `<td class="stop${done?' done':''}">停止</td>`;}
        if(!v.length)return '<td></td>';
        const isS=v.some(x=>x[0]==='S');
        return `<td class="${isS?'ss':'cc'}">${v.map(esc).join('<br>')}</td>`;
      }).join('')}</tr>`).join('')}
    </table></div>`;
  }).join('');
  const CODES_C=[['C1','反スポーツ的行為'],['C2','ラフプレー'],['C3','言葉または行動による異議'],['C4','繰り返しの反則'],['C5','プレーの再開を遅らせる'],['C6','規定の距離を守らない'],['C7','主審の承認を得ずにフィールドに入る'],['C8','主審の承認を得ずにフィールドから出る']];
  const CODES_S=[['S1','著しく不正なプレー'],['S2','乱暴な行為'],['S3','人をかむ、つばを吐く'],['S4','手で得点・決定的な得点の機会を阻止'],['S5','反則で決定的な得点の機会を阻止'],['S6','攻撃的、侮辱的、下品な発言や行動'],['S7','同じ試合で2つ目の警告']];
  const codes=a=>`<div class="codes">${a.map(([k,v])=>`<div><b>${k}</b>${esc(v)}</div>`).join('')}</div>`;
  const legend=`<h2>注釈</h2>
    <p class="sub"><span class="sw" style="background:#F2C200"></span>警告　<span class="sw" style="background:var(--red)"></span>退場　<span class="sw" style="background:var(--ink)"></span>出場停止の試合　<span class="sw" style="border:1px solid var(--sub)"></span>出場停止（消化済み）<br>
    コードのない「C」「S」は、理由の区分が記録されていない警告・退場です。累積警告は、出場停止となった時点と大会終了時に消滅します。</p>
    <p class="sub" style="margin-bottom:0"><b>警告</b></p>${codes(CODES_C)}
    <p class="sub" style="margin-bottom:0"><b>退場</b></p>${codes(CODES_S)}`;
  return top+bar+(body||'<div class="empty">警告・退場はありません</div>')+legend;
}

/* ---------- 試合詳細 ---------- */
function openMatch(id){
  if(DATA&&DATA.competition)setQS(DATA.competition.id,id);
  SCROLL_Y=window.scrollY;
  $('main').innerHTML='<div class="loading">読み込み中…</div>';
  window.scrollTo(0,0);
  run({api:'match',comp:DATA.competition.id,match:id}).then(r=>{
    if(!r.ok||!r.detail||r.detail.error)return showErr({message:(r.detail&&r.detail.error)||r.error});
    DETAIL=r.detail;rMatch();
  }).catch(showErr);
}
function closeMatch(){DETAIL=null;if(DATA&&DATA.competition)setQS(DATA.competition.id,'');render();window.scrollTo(0,SCROLL_Y);}
function rMatch(){
  const d=DETAIL,m=d.match;
  const H=m.home,A=m.away,sc=m.score||{};
  const halves=d.halves?`<div class="half">前半 ${d.halves.first[0]}-${d.halves.first[1]}　後半 ${d.halves.second[0]}-${d.halves.second[1]}${d.halves.extra?`　延長 ${d.halves.extra[0]??0}-${d.halves.extra[1]??0}`:''}${sc.pk?`　PK ${sc.pk.home}-${sc.pk.away}`:''}</div>`:(sc.pk?`<div class="half">PK ${sc.pk.home}-${sc.pk.away}</div>`:'');
  const head=`<div class="mh"><div class="meta">${esc(DATA.competition.name)}　${esc(m.round)}${m.no?'　No.'+esc(m.no):''}</div>
    <div class="row"><span class="tn h">${esc(H.name||H.short)}</span><span class="big">${sc.home!=null?sc.home+' - '+sc.away:'vs'}</span><span class="tn a">${esc(A.name||A.short)}</span></div>
    ${halves}<div class="meta">${esc(jd(m.date))}${m.kickoff?' '+esc(m.kickoff):''}　${esc((d.info&&d.info.venue)||m.venue||'')}</div></div>`;
  // 経過（得点・警告退場・交代を時間順に）
  const evs=[].concat(
    d.goals.map(g=>({s:g.sort,side:g.side,min:g.minute,html:`<span class="goal">⚽ ${esc(g.scorer)}</span>${g.type&&g.type!=='シュート'&&!g.og?` <span class="sub">${esc(g.type)}</span>`:''}${g.assist?`<br><span class="sub">アシスト ${esc(g.assist)}</span>`:''}`})),
    d.cards.map(c=>({s:c.sort,side:c.side,min:c.minute,html:`<span class="ico ${c.kind==='C'?'c':'s'}"></span>${esc(c.name)} <span class="sub">${esc(c.mark)}</span>`})),
    (d.subs||[]).map(x=>({s:x.sort,side:x.side,min:x.minute,html:`<span class="in">▲ ${esc(x.in)}</span><br><span class="out">▼ ${esc(x.out)}</span>`}))
  ).sort((a,b)=>a.s-b.s);
  const tl=evs.length?`<h2>試合経過</h2><ul class="tl">${evs.map(e=>`<li><span class="h">${e.side==='home'?e.html:''}</span><span class="min">${esc(e.min)}${e.min?"'":''}</span><span>${e.side==='away'?e.html:''}</span></li>`).join('')}</ul>`:'';
  const lu=d.lineups?`<h2>メンバー</h2><div class="lu">${['home','away'].map(sd=>{
    const L=d.lineups[sd],T=sd==='home'?H:A;
    const row=p=>`<tr><td class="no">${esc(p.no)}</td><td class="ps">${esc(p.pos)}</td><td>${esc(p.name)}${p.goals?` <span class="ev">⚽${p.goals>1?'×'+p.goals:''}</span>`:''}${p.cards.map(c=>`<span class="ico ${c==='C'?'c':'s'}"></span>`).join('')}${p.out?` <span class="ev out">▼${esc(p.out)}'</span>`:''}${p.in?` <span class="ev in">▲${esc(p.in)}'</span>`:''}</td></tr>`;
    return `<div><h3 style="color:var(--ink);font-weight:700;font-size:14px">${esc(T.short)}</h3><h3>先発</h3><table>${L.starters.map(row).join('')}</table>${L.bench.length?`<h3>控え</h3><table>${L.bench.map(row).join('')}</table>`:''}</div>`;
  }).join('')}</div>`:'';
  const pk=d.pk&&d.pk.length?`<h2>PK戦</h2><div class="lu">${['home','away'].map(sd=>`<div><h3>${esc((sd==='home'?H:A).short)}</h3><table>${d.pk.filter(k=>k.side===sd).map(k=>`<tr><td class="no">${k.order}</td><td>${esc(k.name)}</td><td>${/成功|○/.test(k.result)?'○':'×'}</td></tr>`).join('')}</table></div>`).join('')}</div>`:'';
  const inf=d.info;
  const off=inf&&(inf.referee||inf.ar1)?`<h2>審判員・コンディション</h2><div class="off">${[['主審',inf.referee],['副審',[inf.ar1,inf.ar2].filter(Boolean).join('・')],['第4審',inf.fourth],['天候',inf.weather],['ピッチ',[inf.pitch,inf.pitchCondition].filter(Boolean).join('・')]].filter(x=>x[1]).map(x=>`<div><span>${x[0]}</span>${esc(x[1])}</div>`).join('')}</div>`:'';
  const note=d.source==='report'?'<p class="sub">この試合は試合報告から取り込んだ記録です（先発・交代の記録はありません）。</p>':'';
  $('main').innerHTML=`<button type="button" class="back" onclick="closeMatch()">‹ ${TAB==='tournament'?'トーナメント':TAB==='cards'?'警告・退場':'日程・結果'}に戻る</button>`+head+tl+lu+pk+off+note+
    `<div class="foot">${esc(DATA.competition.name)}　${esc(m.matchId)}</div>`;
}

init();
</script>
</body>
