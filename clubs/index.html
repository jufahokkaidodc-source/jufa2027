<link rel="stylesheet" href="club.css">

</head>
<body>
<header class="hd">
  <div class="wrap">
    <a class="brand" href="#home"><span class="emb" id="emb"></span><span><b id="siteName">読み込み中…</b><small id="siteEn"></small></span></a>
    <button class="menu" id="menu" aria-controls="nav" aria-expanded="false" aria-label="メニュー">☰</button>
    <nav class="nav" id="nav">
      <a href="#home">HOME</a>
      <a href="#news">NEWS</a>
      <a href="#matches">MATCH</a>

      <a href="#club">ABOUT</a>
      <a href="#gallery">GALLERY</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </div>
</header>
<section class="hero" id="hero"></section>
<main id="main"><span class="sk" style="width:60%"></span><span class="sk"></span><span class="sk"></span></main>
<footer class="ft">
  <div class="wrap">
    <div><b id="ftName"></b><p>試合・記録は北海道学生サッカー連盟の公式記録から自動で表示しています。<br><span id="updated"></span></p><div class="sns2" id="ftSns"></div></div>
    <nav><a href="../new/">北海道学生サッカー連盟</a><a href="../new/results.html">大会記録</a></nav>
  </div>
</footer>
<nav class="bnav" aria-label="スマホのメニュー">
  <a href="#home"><i>⌂</i>HOME</a>
  <a href="#matches"><i>⚽</i>MATCH</a>
  <a href="#players"><i>👥</i>TEAM</a>
  <button type="button" id="bMenu" aria-label="メニューを開く"><i>☰</i>MENU</button>
</nav>
<script>
/* チームの独自ホームページ（共通）：clubs/?u=アドレス名
 *  公開している大学は results/data/clubs.json に出る（ホームページ管理画面の「チーム紹介」→「独自ホームページ」で「公開する」）
 *  ?u= がないときは、公開しているチームの一覧。見つからないときは「準備中」
 *  ?preview=キー：公開前のプレビュー（管理画面の「プレビューを見る」。clubs.json にはキーのハッシュだけが入っている） */
(async function () {
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var qs = new URLSearchParams(location.search);
  var slug = (qs.get('u') || '').trim().toLowerCase(), pkey = (qs.get('preview') || '').trim();
  var list = [];
  try { var r = await fetch('../results/data/clubs.json', { cache: 'no-store' }); if (r.ok) list = (await r.json()).clubs || []; } catch (e) {}
  var pub = list.filter(function (x) { return x.published; });
  var c = null, preview = false;
  if (pkey && window.crypto && crypto.subtle) {
    try {
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('club-preview|' + pkey));
      var h = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      c = list.filter(function (x) { return x.preview === h; })[0] || null;
      preview = !!c;
    } catch (e) {}
  } else if (slug) c = pub.filter(function (x) { return x.slug === slug; })[0] || null;
  list = pub;
  if (!c) {
    document.getElementById('hero').hidden = true;
    document.getElementById('nav').style.display = 'none'; document.getElementById('menu').style.display = 'none';
    document.querySelector('.bnav').style.display = 'none';
    document.getElementById('siteName').textContent = '北海道学生サッカー連盟';
    document.getElementById('siteEn').textContent = 'CLUB SITES';
    document.getElementById('ftName').textContent = '北海道学生サッカー連盟';
    document.getElementById('main').innerHTML = '<div class="wrap"><div class="card" style="margin-top:24px;padding:20px"><h2 style="margin-top:0">' + (pkey ? 'プレビューを準備しています' : slug ? 'このページは準備中です' : 'チームのホームページ') + '</h2>' +
      (pkey ? '<p>はじめてのプレビューは、サイトに準備できるまで1〜2分かかります。少し待ってから開き直してください。直らないときは、管理画面からもう一度「プレビューを見る」を押してください。</p>' : slug ? '<p>このチームのホームページは、まだ公開されていません。</p>' : '') +
      (list.length ? '<p>公開しているチーム：</p><ul>' + list.map(function (x) { return '<li><a href="./?u=' + encodeURIComponent(x.slug) + '">' + esc(x.name) + '</a></li>'; }).join('') + '</ul>' : (slug ? '' : '<p>公開しているチームはまだありません。</p>')) +
      '<p><a href="../new/">北海道学生サッカー連盟のホームページへ</a></p></div></div>';
    return;
  }
  // デザイン（a＝DARK IMPACT・b＝CLEAN MODERN・c＝SPORTS EDITORIAL）。?tpl= で、ほかのデザインを試しに見られる（見た目だけ）
  var OLD = { dark: 'a', light: 'b', color: 'c' };
  var normTpl = function (v) { v = String(v || '').trim().toLowerCase(); v = OLD[v] || v; return /^[abc]$/.test(v) ? v : ''; };
  var tpl = normTpl(qs.get('tpl')) || normTpl(c.tpl) || 'a';
  document.body.setAttribute('data-tpl', tpl);
  window.CLUB = { univ: c.univ, name: c.name, en: c.en, lead: c.lead, color: '', hero: '', heroCaption: '', data: '../results/data/', results: '../results/', site: '../new/' };
  document.title = (preview ? '【プレビュー】' : '') + c.name;
  if (preview) {
    // プレビュー：検索に出さない・上に帯
    var nb = document.createElement('div'); nb.className = 'notice';
    nb.textContent = 'プレビュー（' + (c.published ? '公開中のページ' : 'まだ一般には公開していません') + '）　このリンクは、ほかの人に送らないでください';
    document.body.insertBefore(nb, document.body.firstChild);
  } else { var rb = document.querySelector('meta[name=robots]'); if (rb) rb.setAttribute('content', 'index,follow'); }
  var s = document.createElement('script'); s.src = 'club.js'; document.body.appendChild(s);
})();
</script>
</body>
</html>
